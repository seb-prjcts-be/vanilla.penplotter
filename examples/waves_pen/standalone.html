<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>waves pen</title></head>
<body>
  <canvas id="preview" width="600" height="760" style="max-width:100%;height:auto"></canvas>
  <a id="save" download="waves_pen.svg">Save SVG</a>
  <script src="https://cdn.jsdelivr.net/gh/seb-prjcts-be/vanilla.waves@4fad55570d9dab243e99f40181f12b5aede2c5be/waves-core.js"></script>
  <script type="module">
import { PlotterEngine } from "https://cdn.jsdelivr.net/gh/seb-prjcts-be/vanilla.penplotter@4880b41b911ede36b391e2924a4949b27bdb2378/vanilla.penplotter.js";

// A fixed-time drawing: animation time never changes during sampling.
function createWaveDrawing(waves) {
  const plot = new PlotterEngine({
    units: "mm",
    page: { width: 210, height: 297, margin: 18 }
  });
  const sampler = waves.createSampler({
    wave: "triangle sine", range: [-3, 3], frequency: 0.08
  });
  for (let row = 0; row < 32; row += 1) {
    const points = [];
    for (let step = 0; step <= 348; step += 1) {
      const x = 18 + step * 0.5;
      points.push({ x, y: 40 + row * 7 + sampler.sample(x + row * 2, 0) });
    }
    plot.polyline(points, { id: `wave-${row + 1}` });
  }
  plot.optimize({ simplifyTolerance: 0.02 });
  plot.plan();
  return plot;
}

const plot = createWaveDrawing(VanillaWaves);

plot.drawRoute(document.getElementById("preview").getContext("2d"), { showTravel: true });
document.getElementById("save").href = URL.createObjectURL(new Blob([plot.exportSVG()], { type: "image/svg+xml" }));
  </script>
</body>
</html>
