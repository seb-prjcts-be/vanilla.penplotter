<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route lab — vanilla.penplotter</title>
  <link rel="icon" href="../../docs/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../showcase.css">
  <style>
    .controls { display:grid; gap:10px; margin:24px 0; }
    .controls label { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:14px; }
    .controls select { min-height:36px; padding:0 8px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; }
    dd span { color:var(--signal); }
    dd strong { color:var(--ink); font-weight:500; }
  </style>
</head>
<body>
  <header><a href="../../index.html"><span>penplotter</span>.engine</a><a href="../../docs/examples.html">All examples</a></header>
  <main>
    <div class="canvas-wrap"><canvas id="preview" width="640" height="880" aria-label="Preview of the planned route with pen-up travel"></canvas></div>
    <aside class="panel">
      <p class="tag">Optimizer · planner · statistics</p>
      <h1>Route lab</h1>
      <p>Bad input on purpose: chains cut into pieces and shuffled, some drawn twice, and a circle with 1 440 points. Switch the passes on and off and watch what each one buys. Left of the arrow: the raw plan. Right: yours.</p>
      <div class="controls">
        <label><input type="checkbox" data-pass="deduplicate" checked> deduplicate — drop paths drawn twice</label>
        <label><input type="checkbox" data-pass="merge" checked> merge — rejoin chains whose ends touch</label>
        <label><input type="checkbox" data-pass="simplify" checked> simplify — fewer points, same shape (0.05 mm)</label>
        <label><input type="checkbox" data-pass="clean" checked> clean — remove zero-length paths</label>
        <label>strategy <select id="strategy"><option value="nearest">nearest — reorder and reverse paths</option><option value="input">input — draw in the order given</option></select></label>
        <label><input type="checkbox" id="travel" checked> show pen-up travel</label>
      </div>
      <dl id="table" aria-live="polite"></dl>
    </aside>
  </main>
  <script type="module" src="sketch.js"></script>
</body>
</html>
