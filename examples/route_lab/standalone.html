<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>route lab</title></head>
<body>
  <canvas id="preview" width="600" height="760" style="max-width:100%;height:auto"></canvas>
  <a id="save" download="route_lab.svg">Save SVG</a>
  <script type="module">
const response = await fetch(`https://api.github.com/repos/seb-prjcts-be/vanilla.penplotter/commits/main?t=${Date.now()}`, { cache: "no-store" });
if (!response.ok) throw new Error(`Cannot resolve vanilla.penplotter/main: HTTP ${response.status}`);
const { sha } = await response.json();
if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("Invalid vanilla.penplotter commit");
const core = `https://cdn.jsdelivr.net/gh/seb-prjcts-be/vanilla.penplotter@${sha}`;
console.info("penplotter source", { core });
const { PlotterEngine } = await import(`${core}/vanilla.penplotter.js`);
// Route lab — the same drawing, planned badly and planned well.
// Deliberately awkward input: chains cut into pieces and shuffled, exact
// duplicates, and a circle sampled far too densely. Every optimizer pass and
// the planner have something real to do.

function randomFactory(seed) {
  let state = seed >>> 0;
  return () => {
    state += 0x6D2B79F5;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  };
}

function buildRouteLab(seed = 7) {
  const random = randomFactory(seed);
  const plot = new PlotterEngine({ units: "mm", page: { width: 210, height: 297, margin: 15 } });
  const pieces = [];

  // 14 meandering chains, each cut into 8 segments.
  for (let chain = 0; chain < 14; chain += 1) {
    let x = 25 + random() * 160;
    let y = 30 + random() * 230;
    let heading = random() * Math.PI * 2;
    for (let piece = 0; piece < 8; piece += 1) {
      const points = [{ x, y }];
      for (let step = 0; step < 4; step += 1) {
        heading += (random() - 0.5) * 1.1;
        x = Math.min(190, Math.max(20, x + Math.cos(heading) * 4));
        y = Math.min(275, Math.max(22, y + Math.sin(heading) * 4));
        points.push({ x, y });
      }
      pieces.push(points);
    }
  }
  // Every fourth piece twice, as a sloppy generator would.
  const duplicates = pieces.filter((_, index) => index % 4 === 0);
  const all = pieces.concat(duplicates);
  // Shuffle, so the input order is as bad as it gets.
  for (let index = all.length - 1; index > 0; index -= 1) {
    const other = Math.floor(random() * (index + 1));
    [all[index], all[other]] = [all[other], all[index]];
  }
  for (const points of all) plot.polyline(points);

  // A circle with 1440 points: simplify keeps the shape and drops the rest.
  plot.circle(105, 150, 46, { segments: 1440 });
  return plot;
}

const plot = buildRouteLab();
plot.optimize({ mergeTolerance: 0.05, duplicateTolerance: 0.01, simplifyTolerance: 0.05 });

plot.drawRoute(document.getElementById("preview").getContext("2d"), { showTravel: true });
document.getElementById("save").href = URL.createObjectURL(new Blob([plot.exportSVG()], { type: "image/svg+xml" }));
  </script>
</body>
</html>
